<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚦 시장 신호등</title>
  <!-- 추이 차트 라이브러리 (CDN 한 줄, 빌드 불필요) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --green: #2e7d32; --yellow: #f9a825; --orange: #ef6c00;
      --red: #c62828; --gray: #757575;
      --bg: #0f1115; --card: #1a1d24; --text: #e6e6e6; --muted: #9aa0a6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      padding: 16px; max-width: 880px; margin: 0 auto;
    }
    h1 { font-size: 1.3rem; margin: 8px 0 4px; }
    .muted { color: var(--muted); font-size: 0.85rem; }
    /* 큰 신호등 */
    .verdict {
      border-radius: 16px; padding: 24px; margin: 16px 0; text-align: center;
      color: #fff; transition: background 0.3s;
    }
    .verdict .emoji { font-size: 3rem; }
    .verdict .title { font-size: 1.5rem; font-weight: 700; margin-top: 4px; }
    .verdict .date { opacity: 0.85; font-size: 0.85rem; margin-top: 6px; }
    .bg-green { background: var(--green); } .bg-yellow { background: var(--yellow); }
    .bg-orange { background: var(--orange); } .bg-red { background: var(--red); }
    .bg-gray { background: var(--gray); }
    /* 행동 가이드 */
    .actions { background: var(--card); border-radius: 12px; padding: 14px 18px; margin: 12px 0; }
    .actions h3 { margin: 0 0 8px; font-size: 1rem; }
    .actions ul { margin: 0; padding-left: 18px; }
    .actions li { margin: 4px 0; }
    .warn { color: var(--yellow); margin: 6px 0; }
    /* 지표 카드 */
    .tier-title { margin: 18px 0 8px; font-size: 1rem; color: var(--muted); }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .card {
      background: var(--card); border-radius: 12px; padding: 12px;
      border-left: 6px solid var(--gray);
    }
    .card.green { border-color: var(--green); } .card.yellow { border-color: var(--yellow); }
    .card.orange { border-color: var(--orange); } .card.red { border-color: var(--red); }
    .card .name { font-size: 0.85rem; color: var(--muted); }
    .card .value { font-size: 1.3rem; font-weight: 700; margin: 4px 0; }
    .card .meta { font-size: 0.72rem; color: var(--muted); }
    .flag { font-size: 0.7rem; padding: 1px 6px; border-radius: 6px; background: #333; margin-left: 4px; }
    /* 펼쳐보기(쉬운 설명) */
    details { margin-top: 6px; }
    details summary { cursor: pointer; font-size: 0.72rem; color: #6db3f2; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    .explain { font-size: 0.78rem; color: var(--text); margin-top: 6px; line-height: 1.5; }
    .explain .meaning { font-weight: 700; }
    .explain .why { color: var(--muted); }
    /* 온보딩 */
    .onboarding { background: var(--card); border-radius: 12px; padding: 6px 18px; margin: 12px 0; }
    .onboarding summary { font-size: 0.95rem; color: var(--text); font-weight: 600; padding: 10px 0; }
    .onboarding ul { margin: 0 0 12px; padding-left: 18px; }
    .onboarding li { margin: 6px 0; font-size: 0.85rem; line-height: 1.5; }
    .v-plain { font-size: 1rem; margin-top: 10px; opacity: 0.95; line-height: 1.4; }
    /* 차트/기타 */
    .chart-box { background: var(--card); border-radius: 12px; padding: 14px; margin: 16px 0; }
    .manual { background: var(--card); border-radius: 12px; padding: 14px 18px; margin: 16px 0; }
    .manual h3 { margin: 0 0 8px; font-size: 1rem; }
    footer { color: var(--muted); font-size: 0.75rem; margin: 24px 0; line-height: 1.5; border-top: 1px solid #2a2d34; padding-top: 14px; }
    #error { color: var(--red); padding: 16px; display: none; }
  </style>
</head>
<body>
  <h1>🚦 시장 신호등</h1>
  <div class="muted" id="updated">데이터 불러오는 중…</div>

  <!-- 🔰 이 신호등이 뭐예요? (사용법) -->
  <details class="onboarding" id="onboarding-box">
    <summary>🔰 이 신호등이 뭐예요? (처음이면 눌러보세요)</summary>
    <ul id="onboarding"></ul>
  </details>

  <div id="error">
    데이터(latest.json)를 불러오지 못했습니다. GitHub Actions가 한 번 이상 실행되어야 데이터가 생깁니다.
  </div>

  <!-- 큰 신호등 -->
  <div id="verdict" class="verdict bg-gray">
    <div class="emoji" id="v-emoji">⚪</div>
    <div class="title" id="v-title">불러오는 중</div>
    <div class="v-plain" id="v-plain"></div>
    <div class="date" id="v-date"></div>
  </div>

  <!-- 행동 가이드 -->
  <div class="actions">
    <h3>행동 가이드</h3>
    <div id="warnings"></div>
    <ul id="actions"></ul>
  </div>

  <!-- 지표 카드 (Tier별) -->
  <div id="tiers"></div>

  <!-- 추이 차트 -->
  <div class="chart-box">
    <h3 style="margin:0 0 8px; font-size:1rem;">과거 추이</h3>
    <div class="muted" id="chart-note"></div>
    <canvas id="chart" height="160"></canvas>
  </div>

  <!-- 수동 확인 필요 -->
  <div class="manual">
    <h3>🔍 수동 확인 필요 (자동화 안 됨)</h3>
    <ul id="manual"></ul>
  </div>

  <footer id="disclaimer"></footer>

  <script>
    // 신호등 색 → CSS 클래스 / 이모지
    const SIGNAL_EMOJI = { green: "🟢", yellow: "🟡", orange: "🟠", red: "🔴", null: "⚪" };
    const GRADE_BG = { green: "bg-green", yellow: "bg-yellow", orange: "bg-orange", red: "bg-red", gray: "bg-gray" };

    async function load() {
      let latest, history;
      try {
        // 캐시 방지를 위해 시각을 쿼리로 붙임
        const bust = "?t=" + Date.now();
        latest = await (await fetch("data/latest.json" + bust)).json();
        try { history = await (await fetch("data/history.json" + bust)).json(); } catch (e) { history = null; }
      } catch (e) {
        document.getElementById("error").style.display = "block";
        document.getElementById("updated").textContent = "";
        return;
      }
      render(latest, history);
    }

    function render(d, history) {
      const c = d.composite;
      // 큰 신호등
      const v = document.getElementById("verdict");
      v.className = "verdict " + (GRADE_BG[c.grade] || "bg-gray");
      document.getElementById("v-emoji").textContent = c.emoji;
      document.getElementById("v-title").textContent = c.title;
      document.getElementById("v-plain").textContent = c.plain || "";  // 주린이 한 줄
      document.getElementById("v-date").textContent = "데이터 기준일: " + (d.data_date || "-");

      // 온보딩(사용법)
      document.getElementById("onboarding").innerHTML =
        (d.onboarding || []).map(t => "<li>" + t + "</li>").join("");
      document.getElementById("updated").textContent =
        "마지막 업데이트: " + d.updated_kst + " · 위험 점등 T1:" + c.tier_danger["1"] +
        " T2:" + c.tier_danger["2"] + " T3:" + c.tier_danger["3"] + " · 결측 " + c.missing + "/" + c.active;

      // 보조경고 + 행동
      const warns = document.getElementById("warnings");
      warns.innerHTML = (c.warnings || []).map(w => '<div class="warn">' + w + "</div>").join("");
      document.getElementById("actions").innerHTML =
        (c.actions || []).map(a => "<li>" + a + "</li>").join("");

      // 지표 카드 (Tier별)
      const tiers = document.getElementById("tiers");
      tiers.innerHTML = "";
      [1, 2, 3].forEach(tier => {
        const items = d.indicators.filter(i => i.tier === tier);
        if (!items.length) return;
        const title = document.createElement("div");
        title.className = "tier-title";
        title.textContent = "Tier " + tier + (tier === 1 ? " · 신용시장" : tier === 2 ? " · 매크로" : " · 시장·심리");
        tiers.appendChild(title);
        const grid = document.createElement("div");
        grid.className = "cards";
        items.forEach(i => {
          const sig = i.signal || "gray";
          const cls = i.signal ? i.signal : "";
          let valText = i.missing ? "결측" : (i.value + (i.unit || ""));
          let flag = "";
          if (i.skipped) flag = '<span class="flag">미수집</span>';
          else if (i.missing) flag = '<span class="flag">결측</span>';
          else if (i.stale) flag = '<span class="flag">오래됨</span>';
          // 주린이용 쉬운 설명 (펼쳐보기)
          let explain = "";
          if (i.what || i.why) {
            explain =
              '<details><summary>ⓘ 쉬운 설명</summary>' +
                '<div class="explain">' +
                  (i.meaning ? '<div class="meaning">' + (SIGNAL_EMOJI[i.signal] || "⚪") + " " + i.meaning + "</div>" : "") +
                  (i.what ? "<div>" + i.what + "</div>" : "") +
                  (i.why ? '<div class="why">' + i.why + "</div>" : "") +
                "</div>" +
              "</details>";
          }
          grid.innerHTML +=
            '<div class="card ' + cls + '">' +
              '<div class="name">' + (SIGNAL_EMOJI[i.signal] || "⚪") + " " + i.name + "</div>" +
              '<div class="value">' + valText + "</div>" +
              '<div class="meta">' + (i.date || "-") + flag + "</div>" +
              explain +
            "</div>";
        });
        tiers.appendChild(grid);
      });

      // 수동 확인 필요
      document.getElementById("manual").innerHTML =
        (d.manual_check || []).map(m => "<li>" + m + "</li>").join("");

      // 면책
      document.getElementById("disclaimer").textContent = "⚠️ " + (d.disclaimer || "");

      // 추이 차트
      drawChart(history);
    }

    function drawChart(history) {
      const note = document.getElementById("chart-note");
      if (!history || !history.dates || history.dates.length < 2) {
        note.textContent = "추이 데이터 누적 중… (이틀 이상 쌓이면 그래프가 그려집니다)";
        return;
      }
      note.textContent = "";
      const colors = ["#ef6c00", "#42a5f5", "#ab47bc", "#26a69a"];
      const datasets = Object.keys(history.series).map((name, idx) => ({
        label: name,
        data: history.series[name],
        borderColor: colors[idx % colors.length],
        backgroundColor: "transparent",
        spanGaps: true, tension: 0.25, pointRadius: 2,
      }));
      new Chart(document.getElementById("chart"), {
        type: "line",
        data: { labels: history.dates, datasets },
        options: {
          responsive: true,
          plugins: { legend: { labels: { color: "#e6e6e6" } } },
          scales: {
            x: { ticks: { color: "#9aa0a6" }, grid: { color: "#2a2d34" } },
            y: { ticks: { color: "#9aa0a6" }, grid: { color: "#2a2d34" } },
          },
        },
      });
    }

    load();
  </script>
</body>
</html>
